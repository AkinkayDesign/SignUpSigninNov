<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NovaTech - Sign In</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/signin.css" />
  </head>

  <body>
    <main class="auth-page">
      <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
          <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
            <div class="auth-card">
              <!-- Logo -->
              <div class="text-center mb-4">
                <a href="index.html" class="logo"> Nova<span>Tech</span> </a>

                <h1>Welcome Back</h1>

                <p class="subtitle">Sign in to continue to NovaTech.</p>
              </div>

              <!-- Sign In Form -->
              <form id="signinForm">
                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label"> Email Address </label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-envelope"></i>
                    </span>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="Enter your email"
                      required
                    />
                  </div>
                </div>
                <!-- Password -->
                <div class="mb-3">
                  <div class="d-flex justify-content-between">
                    <label for="password" class="form-label"> Password </label>

                    <a href="#" class="forgot-password"> Forgot Password? </a>
                  </div>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-lock"></i>
                    </span>

                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Enter your password"
                      required
                    />
                  </div>
                </div>

                <!-- Remember Me -->
                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  />

                  <label class="form-check-label" for="remember">
                    Remember me
                  </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn signin-btn w-100">
                  Sign In
                </button>
              </form>

              <!-- Sign Up -->
              <p class="switch-text text-center mt-4 mb-0">
                Don't have an account?

                <a href="signup.html"> Create Account </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Signin JS -->
    <script src="./js/signin.js"></script>
  </body>
</html>
