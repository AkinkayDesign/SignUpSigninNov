<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NovaTech - Sign Up</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/signup.css" />
  </head>

  <body>
    <main class="auth-page">
      <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
          <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
            <div class="auth-card">
              <!-- Logo -->
              <div class="text-center mb-4">
                <a href="index.html" class="logo"> Nova<span>Tech</span> </a>

                <h1>Create Account</h1>
                <p class="subtitle">Join NovaTech and get started today.</p>
              </div>

              <!-- Signup Form -->
              <form id="signupForm">
                <!-- Full Name -->
                <div class="mb-3">
                  <label for="name" class="form-label"> Full Name </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-person"></i>
                    </span>

                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      placeholder="Enter your full name"
                      required
                    />
                  </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label"> Email Address </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-envelope"></i>
                    </span>

                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="Enter your email"
                      required
                    />
                  </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label for="password" class="form-label"> Password </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-lock"></i>
                    </span>

                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Create a password"
                      required
                    />
                  </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">
                    Confirm Password
                  </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-shield-lock"></i>
                    </span>

                    <input
                      type="password"
                      class="form-control"
                      id="confirmPassword"
                      placeholder="Confirm your password"
                      required
                    />
                  </div>
                </div>

                <!-- Terms -->
                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms"
                    required
                  />

                  <label class="form-check-label" for="terms">
                    I agree to the terms and conditions.
                  </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn signup-btn w-100">
                  Create Account
                </button>
              </form>

              <!-- Sign In -->
              <p class="switch-text text-center mt-4 mb-0">
                Already have an account?
                <a href="signin.html">Sign In</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Signup JS -->
    <script src="./js/signup.js"></script>
  </body>
</html>
